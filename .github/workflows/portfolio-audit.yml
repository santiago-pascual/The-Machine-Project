name: Offline portfolio audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas matplotlib pytest
      - run: python -m pytest -q tests/test_portfolio_audit.py
      - run: python scripts/portfolio_audit.py --root . --out "$RUNNER_TEMP/machine-audit"
